services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: retiros
      POSTGRES_USER: retiros
      POSTGRES_PASSWORD: retiros
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retiros"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # En desarrollo, docker-compose.override.yml monta el código y agrega
    # Vite (recarga en caliente): ver README.

volumes:
  pgdata:

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @page {
    size: A4 {% if horizontal %}landscape{% endif %};
    margin: 1.5cm 1.2cm;
    @bottom-left { content: "Betania · {{ generado }} · {{ usuario }}"; font-family: "DejaVu Sans", sans-serif; font-size: 8px; color: #888; }
    @bottom-right { content: "Página " counter(page) " de " counter(pages); font-family: "DejaVu Sans", sans-serif; font-size: 8px; color: #888; }
  }
  body { font-family: "DejaVu Sans", sans-serif; color: #222; font-size: {% if horizontal %}9px{% else %}10px{% endif %}; }
  h1 { font-size: 16px; margin: 0 0 2px; }
  .sub { color: #666; margin-bottom: 4px; }
  .total { color: #666; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #e4e7ec; vertical-align: top; }
  th { background: #f2f4f7; font-weight: bold; }
  tbody tr:nth-child(even) td { background: #fafafa; }
  td.cifra { white-space: nowrap; }
</style>
</head>
<body>
  <h1>{{ titulo }}</h1>
  {% if subtitulo %}<div class="sub">{{ subtitulo }}</div>{% endif %}
  <div class="total">{{ filas|length }} registro{{ filas|length|pluralize }}</div>
  <table>
    <thead>
      <tr>{% for c in columnas %}<th>{{ c }}</th>{% endfor %}</tr>
    </thead>
    <tbody>
      {% for fila in filas %}
      <tr>{% for v, cifra in fila %}<td{% if cifra %} class="cifra"{% endif %}>{{ v }}</td>{% endfor %}</tr>
      {% empty %}
      <tr><td colspan="{{ columnas|length }}">Sin registros.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
